default_language_version:
  python: python3.14
ci:
  autoupdate_schedule: quarterly
  skip: ["clang-tidy"] # needs a local Meson build of the C extension, unavailable on pre-commit.ci
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c" # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(tools/fuzz/corpus|tests/fuzz_regressions)/.*$ # byte-exact crash inputs
      - id: trailing-whitespace
        exclude: ^(tools/fuzz/corpus|tests/fuzz_regressions)/.*$ # byte-exact crash inputs
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0494aa7fa1314e98913a41227d8f0a515b2c1049" # frozen: 0.38.2
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
  - repo: https://github.com/codespell-project/codespell
    rev: "57b21406f092110c18776e39b0bda50d37c945c8" # frozen: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/tox-dev/tox-toml-fmt
    rev: "5125f601c3e134347288c3d42f3b34298b7cf1be" # frozen: v1.11.1
    hooks:
      - id: tox-toml-fmt
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "50e0f3aee9dc5747a5f173f79a7417403c18dda6" # frozen: v2.30.3
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: "98ad4ddb9c057de2f5b9e93e44e6db959807d68c" # frozen: v23.1.3
    hooks:
      - id: clang-format
        files: ^src/turbohtml/.*\.(c|h)$
        exclude: ^src/turbohtml/_c/(data/(html_entities|entity_names|tld_table|psl_table|idna_table|normalize_table|encoding_tables|phone_table)|encoding/detect_data)\.h$ # generated tables
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "38bfb07c0c64c304f47eb52090f8288150c77730" # frozen: v0.17.1
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: ["--fix", "--unsafe-fixes", "--exit-non-zero-on-fix"]
  - repo: https://github.com/hukkin/mdformat
    rev: "82912cdaea4fb830f751504486a7879c70526547" # frozen: 1.0.0
    hooks:
      - id: mdformat
        args: ["--wrap", "120"]
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-ruff==0.1.3
          - mdformat-frontmatter==2.1.2
  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: "497f8ebf9d58162bb5898e3973a633d31d511169" # frozen: v0.0.5
    hooks:
      - id: sync-pre-commit-deps
  - repo: https://github.com/google/yamlfmt
    rev: "21ca5323a9c87ee37a434e0ca908efc0a89daa07" # frozen: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: python tools/run_clang_tidy.py
        language: python
        language_version: python3.15
        files: ^src/turbohtml/.*\.c$
        require_serial: true
        additional_dependencies:
          - clang-tidy==22.1.8
          - meson==1.12.1
          - ninja==1.13.2
      - id: ruff-docs
        name: ruff (doc snippets)
        entry: python tools/ruff_docs.py
        language: python
        files: ^docs/.*\.rst$
        additional_dependencies:
          - ruff==0.17.1
  - repo: https://github.com/LilSpazJoekp/docstrfmt
    rev: "c1813841673cdcd6cf602dde1edb78a5d5e45235" # frozen: v2.2.1
    hooks:
      - id: docstrfmt
        args: ["--line-length=120", "--no-format-python-code-blocks"] # ruff-docs owns the Python snippets
        additional_dependencies:
          - sphinx==9.1.0
        types_or: [rst]
        files: ^docs/.*\.rst$
  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: "c883505f64b59c3c5c9375191e4ad9f98e727ccd" # frozen: v1.0.2
    hooks:
      - id: sphinx-lint
        types: [rst]
        files: ^docs/.*\.rst$
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: "c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f" # frozen: v1.31.1
    hooks:
      - id: zizmor
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
