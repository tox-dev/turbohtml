# prek runs lower priorities first and equal ones concurrently, so hooks sharing a priority never write the same
# file; pre-commit ignores the key and runs hooks in file order.
default_language_version:
  python: python3.14
ci:
  autoupdate_schedule: quarterly
  skip: ["clang-tidy"] # needs a local Meson build of the C extension, unavailable on pre-commit.ci
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c" # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
        priority: 1
        exclude: ^(tools/fuzz/corpus|tests/fuzz_regressions)/.*$ # byte-exact crash inputs
      - id: trailing-whitespace
        priority: 2
        exclude: ^(tools/fuzz/corpus|tests/fuzz_regressions)/.*$ # byte-exact crash inputs
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "a76b92851fc9eede9f9bc4073eb55202f34eb0df" # frozen: 0.39.0
    hooks:
      - id: check-github-workflows
        priority: 8
        args: ["--verbose"]
  - repo: https://github.com/codespell-project/codespell
    rev: "57b21406f092110c18776e39b0bda50d37c945c8" # frozen: v2.4.3
    hooks:
      - id: codespell
        priority: 8
  - repo: https://github.com/tox-dev/tox-toml-fmt
    rev: "5125f601c3e134347288c3d42f3b34298b7cf1be" # frozen: v1.11.1
    hooks:
      - id: tox-toml-fmt
        priority: 3
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "50e0f3aee9dc5747a5f173f79a7417403c18dda6" # frozen: v2.30.3
    hooks:
      - id: pyproject-fmt
        priority: 3
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: "98ad4ddb9c057de2f5b9e93e44e6db959807d68c" # frozen: v23.1.3
    hooks:
      - id: clang-format
        priority: 3
        files: ^src/turbohtml/.*\.(c|h)$
        exclude: ^src/turbohtml/_c/(data/(html_entities|entity_names|tld_table|psl_table|idna_table|normalize_table|encoding_tables|phone_table)|encoding/detect_data)\.h$ # generated tables
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c" # frozen: v0.17.3
    hooks:
      - id: ruff-check
        priority: 5
        args: ["--fix", "--unsafe-fixes", "--exit-non-zero-on-fix"]
  - repo: https://github.com/gaborbernat/simplint-pre-commit
    rev: "f15525433ac9797aa1580f46fdadfe60dd77923c" # frozen: v0.8.0
    hooks:
      - id: simplint
        priority: 6
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c" # frozen: v0.17.3
    hooks:
      - id: ruff-format
        priority: 7
  - repo: https://github.com/hukkin/mdformat
    rev: "82912cdaea4fb830f751504486a7879c70526547" # frozen: 1.0.0
    hooks:
      - id: mdformat
        priority: 3
        args: ["--wrap", "120"]
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-ruff==0.1.3
          - mdformat-frontmatter==2.2.0
  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: "497f8ebf9d58162bb5898e3973a633d31d511169" # frozen: v0.0.5
    hooks:
      - id: sync-pre-commit-deps
        priority: 0
  - repo: https://github.com/google/yamlfmt
    rev: "21ca5323a9c87ee37a434e0ca908efc0a89daa07" # frozen: v0.21.0
    hooks:
      - id: yamlfmt
        priority: 3
  - repo: local
    hooks:
      - id: clang-tidy
        priority: 8
        name: clang-tidy
        entry: python tools/run_clang_tidy.py
        language: python
        language_version: python3.15
        files: ^src/turbohtml/.*\.c$
        require_serial: true
        additional_dependencies:
          - clang-tidy==22.1.8
          - meson==1.12.1
          - ninja==1.13.2
      - id: ruff-docs
        priority: 4
        name: ruff (doc snippets)
        entry: python tools/ruff_docs.py
        language: python
        files: ^docs/.*\.rst$
        additional_dependencies:
          - ruff==0.17.1
  - repo: https://github.com/LilSpazJoekp/docstrfmt
    rev: "c1813841673cdcd6cf602dde1edb78a5d5e45235" # frozen: v2.2.1
    hooks:
      - id: docstrfmt
        priority: 3
        args: ["--line-length=120", "--no-format-python-code-blocks"] # ruff-docs owns the Python snippets
        additional_dependencies:
          - sphinx==9.2.0
        types_or: [rst]
        files: ^docs/.*\.rst$
  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: "c883505f64b59c3c5c9375191e4ad9f98e727ccd" # frozen: v1.0.2
    hooks:
      - id: sphinx-lint
        priority: 8
        types: [rst]
        files: ^docs/.*\.rst$
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: "c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f" # frozen: v1.31.1
    hooks:
      - id: zizmor
        priority: 8
  - repo: meta
    hooks:
      - id: check-hooks-apply
        priority: 8
      - id: check-useless-excludes
        priority: 8
