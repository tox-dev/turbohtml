name: 🚀 Release
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]
    tags: ["*"]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          set -euo pipefail
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
      - name: Check tagged source
        run: '"$RUNNER_TEMP/release-tools/bin/prek" run --all-files'
      - name: Check source remains clean
        run: test -z "$(git status --porcelain)"
  sdist:
    name: 📦 sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Build sdist
        run: |
          python tools/build_constraints.py pylock.toml "$RUNNER_TEMP/build-constraints.txt"
          uv build --sdist --build-constraint "$RUNNER_TEMP/build-constraints.txt" --out-dir dist
      - name: 📤 Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          retention-days: 7
  source-install:
    name: Source install - Windows ARM64
    needs: sdist
    runs-on: windows-11-arm
    steps:
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        env:
          UV_VENV_SEED: "true"
        with:
          enable-cache: false
          activate-environment: true
          python-version: "3.15"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-sdist
          path: dist
      - name: Install source distribution
        run: python -m pip install --verbose (Get-ChildItem dist/*.tar.gz).FullName
      - name: Check installed extension
        run: python -c "from turbohtml import parse; assert parse('<p>ARM64</p>').select_one('p').text == 'ARM64'"
  wheels:
    name: 🎡 wheels - ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: "ubuntu-24.04", label: Linux manylinux, build: "*-manylinux*", artifact: linux-manylinux}
          - {os: "ubuntu-24.04", label: Linux musllinux, build: "*-musllinux*", artifact: linux-musllinux}
          - {os: "ubuntu-24.04-arm", label: Linux ARM manylinux, build: "*-manylinux*", artifact: linux-arm-manylinux}
          - {os: "ubuntu-24.04-arm", label: Linux ARM musllinux, build: "*-musllinux*", artifact: linux-arm-musllinux}
          - {os: "macos-15", label: macOS, build: "*", artifact: macos-15}
          - {os: "windows-2025", label: Windows, build: "*", artifact: windows-2025}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ⬇️ Install PGO corpora
        if: runner.os == 'Linux'
        run: |
          git submodule update --init --depth 1 \
            tests/html5lib-tests tools/html5lib-python \
            tools/bench-data/war-and-peace tools/bench-data/readability \
            tools/bench-data/normalize.css tools/bench-data/pico \
            tools/bench-data/underscore tools/bench-data/backbone
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Derive locked build constraints
        run: python tools/build_constraints.py pylock.toml build-constraints.txt
      - name: 🎡 Build wheels
        uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ENVIRONMENT: UV_BUILD_CONSTRAINT="$(pwd)/build-constraints.txt"
      - name: 📤 Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          retention-days: 7
  wheels-gate:
    name: 🎡 wheels - ${{ matrix.label }}
    needs: wheels
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        label: [Linux, Linux ARM]
    steps:
      - run: test '${{ needs.wheels.result }}' = success
  wheel-metadata:
    needs: [sdist, wheels]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked package checks
        run: |
          set -euo pipefail
          uv venv --python 3.15 "$RUNNER_TEMP/package-checks"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/package-checks/bin/python" --group pkg-meta pylock.toml
          echo "$RUNNER_TEMP/package-checks/bin" >>"$GITHUB_PATH"
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Check wheel contents
        run: check-wheel-contents --no-config dist
  verify-changelog:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a changelog section for the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected release tag $TAG"
            exit 1
          fi
          if ! grep -qE "^ v${TAG//./\\.} \\(" docs/changelog.rst; then
            echo "::error::docs/changelog.rst has no section for $TAG"
            exit 1
          fi
  release-gate:
    name: Release checks pass
    if: always()
    needs: [source-check, sdist, source-install, wheels, wheels-gate, wheel-metadata]
    runs-on: ubuntu-26.04
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS_JSON"
  publish:
    name: 🚀 Publish ${{ matrix.artifact }}
    needs: [release-gate, verify-changelog, github-notes]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # one job per build artifact: signing every wheel in a single job exceeds the
    # Sigstore identity lifetime (sigstore.oidc.ExpiredIdentity), so split the upload
    # so each fresh OIDC token only has to attest its platform's wheels
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - dist-sdist
          - dist-linux-manylinux
          - dist-linux-musllinux
          - dist-linux-arm-manylinux
          - dist-linux-arm-musllinux
          - dist-macos-15
          - dist-windows-2025
    environment:
      name: release
      url: https://pypi.org/project/turbohtml
    permissions:
      id-token: write # trusted publishing, no API token stored
    steps:
      - name: ⬇️ Download ${{ matrix.artifact }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: 🚀 Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          attestations: true
  previous-tag:
    needs: verify-changelog
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          set -euo pipefail
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - name: Select previous tag
        id: previous
        env:
          TAG: ${{ github.ref_name }}
        run: |
          previous=$(git tag --list | release-creator tags "$TAG" --previous)
          echo "tag=$previous" >>"$GITHUB_OUTPUT"
  contributor-metadata:
    needs: previous-tag
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Fetch contributor metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.previous-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "$PREVIOUS" ]]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f previous_tag_name="$PREVIOUS" \
              --jq .body >"$RUNNER_TEMP/generated-notes.md"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              --jq .body >"$RUNNER_TEMP/generated-notes.md"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contributor-metadata
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error
          retention-days: 1
  github-notes:
    needs: contributor-metadata
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          set -euo pipefail
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contributor-metadata
          path: ${{ runner.temp }}/contributor-metadata
      - uses: tox-dev/github-workflows/render-release-notes@296388849cced16665b3e8b4397a22265418d3dc
        with:
          tag: ${{ github.ref_name }}
          changelog: docs/changelog.rst
          repository: ${{ github.repository }}
          issue-role: issue
          artifact-url: https://pypi.org/project/turbohtml/${{ github.ref_name }}/
          generated-notes: ${{ runner.temp }}/contributor-metadata/generated-notes.md
          output: ${{ runner.temp }}/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1
  github-release:
    needs: [publish, github-notes]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/github-release-notes
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "v$TAG" --notes-file "$RUNNER_TEMP/github-release-notes/release-notes.md"
