name: 🚀 Release
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]
    tags: ["*"]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          groups: release-check
          venv: ${{ runner.temp }}/release-tools
      - name: Check tagged source
        run: '"$RUNNER_TEMP/release-tools/bin/prek" run --all-files'
      - name: Check source remains clean
        run: test -z "$(git status --porcelain)"
  build-constraints:
    name: Build constraints
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Export Linux build requirements
        id: linux
        uses: tox-dev/github-workflows/export-build-constraints@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          lock: pylock.pgo.toml
          target-platform: linux_x86_64
          targets: 3.11.0:cpython 3.12.0:cpython 3.13.0:cpython 3.14.0:cpython 3.15.0:cpython 3.11.0:pypy 3.12.0:pypy
      - name: Save Linux constraints
        env:
          SOURCE: ${{ steps.linux.outputs.path }}
        run: cp "$SOURCE" "$RUNNER_TEMP/build-constraints-linux.txt"
      - name: Export Linux ARM build requirements
        id: linux_arm
        uses: tox-dev/github-workflows/export-build-constraints@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          lock: pylock.pgo.toml
          target-platform: linux_aarch64
          targets: 3.11.0:cpython 3.12.0:cpython 3.13.0:cpython 3.14.0:cpython 3.15.0:cpython 3.11.0:pypy 3.12.0:pypy
      - name: Save Linux ARM constraints
        env:
          SOURCE: ${{ steps.linux_arm.outputs.path }}
        run: cp "$SOURCE" "$RUNNER_TEMP/build-constraints-linux-arm.txt"
      - name: Export macOS build requirements
        id: macos
        uses: tox-dev/github-workflows/export-build-constraints@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          lock: pylock.pgo.toml
          target-platform: macos_arm64
          targets: 3.11.0:cpython 3.12.0:cpython 3.13.0:cpython 3.14.0:cpython 3.15.0:cpython 3.11.0:pypy 3.12.0:pypy
      - name: Save macOS constraints
        env:
          SOURCE: ${{ steps.macos.outputs.path }}
        run: cp "$SOURCE" "$RUNNER_TEMP/build-constraints-macos.txt"
      - name: Export Windows build requirements
        id: windows
        uses: tox-dev/github-workflows/export-build-constraints@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          lock: pylock.pgo.toml
          target-platform: windows_amd64
          targets: 3.11.0:cpython 3.12.0:cpython 3.13.0:cpython 3.14.0:cpython 3.15.0:cpython 3.11.0:pypy 3.12.0:pypy
      - name: Save Windows constraints
        env:
          SOURCE: ${{ steps.windows.outputs.path }}
        run: cp "$SOURCE" "$RUNNER_TEMP/build-constraints-windows.txt"
      - name: Export Windows ARM build requirements
        id: windows_arm
        uses: tox-dev/github-workflows/export-build-constraints@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          lock: pylock.pgo.toml
          target-platform: windows_arm64
          targets: 3.15.0:cpython
      - name: Save Windows ARM constraints
        env:
          SOURCE: ${{ steps.windows_arm.outputs.path }}
        run: cp "$SOURCE" "$RUNNER_TEMP/build-constraints-windows-arm.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-constraints
          path: ${{ runner.temp }}/build-constraints-*.txt
          if-no-files-found: error
          retention-days: 1
  sdist:
    name: 📦 sdist
    needs: build-constraints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-constraints
          path: ${{ runner.temp }}
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Read source timestamp
        id: timestamp
        run: echo "epoch=$(git log -1 --pretty=%ct)" >>"$GITHUB_OUTPUT"
      - name: 📦 Build sdist
        env:
          UV_BUILD_CONSTRAINT: ${{ runner.temp }}/build-constraints-linux.txt
          UV_REQUIRE_BUILD_HASHES: "true"
          SOURCE_DATE_EPOCH: ${{ steps.timestamp.outputs.epoch }}
        run: uv build --sdist --out-dir dist
      - name: 📤 Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          retention-days: 7
  source-install:
    name: Source install - Windows ARM64
    needs: [build-constraints, sdist]
    runs-on: windows-11-arm
    steps:
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        env:
          UV_VENV_SEED: "true"
        with:
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: "3.15"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-sdist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-constraints
          path: ${{ runner.temp }}
      - name: Install source distribution
        env:
          UV_BUILD_CONSTRAINT: ${{ runner.temp }}/build-constraints-windows-arm.txt
          UV_REQUIRE_BUILD_HASHES: "true"
        run: uv pip install --python "$env:VIRTUAL_ENV" --verbose (Get-ChildItem dist/*.tar.gz).FullName
      - name: Check installed extension
        run: python -c "from turbohtml import parse; assert parse('<p>ARM64</p>').select_one('p').text == 'ARM64'"
  wheels:
    name: 🎡 wheels - ${{ matrix.label }}
    needs: build-constraints
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: "ubuntu-24.04", label: Linux manylinux, build: "*-manylinux*", artifact: linux-manylinux, constraints: linux}
          - {os: "ubuntu-24.04", label: Linux musllinux, build: "*-musllinux*", artifact: linux-musllinux, constraints: linux}
          - {os: "ubuntu-24.04-arm", label: Linux ARM manylinux, build: "*-manylinux*", artifact: linux-arm-manylinux, constraints: linux-arm}
          - {os: "ubuntu-24.04-arm", label: Linux ARM musllinux, build: "*-musllinux*", artifact: linux-arm-musllinux, constraints: linux-arm}
          - {os: "macos-15", label: macOS, build: "*", artifact: macos-15, constraints: macos}
          - {os: "windows-2025", label: Windows, build: "*", artifact: windows-2025, constraints: windows}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ⬇️ Install PGO corpora
        if: runner.os == 'Linux'
        run: |
          git submodule update --init --depth 1 \
            tests/html5lib-tests tools/html5lib-python \
            tools/bench-data/war-and-peace tools/bench-data/readability \
            tools/bench-data/normalize.css tools/bench-data/pico \
            tools/bench-data/underscore tools/bench-data/backbone
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-constraints
          path: .
      - name: Read source timestamp
        id: timestamp
        shell: bash
        run: echo "epoch=$(git log -1 --pretty=%ct)" >>"$GITHUB_OUTPUT"
      - name: 🎡 Build wheels
        uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        env:
          CIBW_BUILD: ${{ matrix.build }}
          SOURCE_DATE_EPOCH: ${{ steps.timestamp.outputs.epoch }}
          CIBW_ENVIRONMENT: UV_BUILD_CONSTRAINT=build-constraints-${{ matrix.constraints }}.txt UV_REQUIRE_BUILD_HASHES=true SOURCE_DATE_EPOCH=${{ steps.timestamp.outputs.epoch }}
      - name: 📤 Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          retention-days: 7
  wheels-gate:
    name: 🎡 wheels - ${{ matrix.label }}
    needs: wheels
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        label: [Linux, Linux ARM]
    steps:
      - env:
          WHEELS_RESULT: ${{ needs.wheels.result }}
        run: test "$WHEELS_RESULT" = success
  wheel-metadata:
    needs: [sdist, wheels]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked package checks
        uses: tox-dev/github-workflows/install-locked-tools@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          venv: ${{ runner.temp }}/package-checks
          groups: pkg-meta
      - name: Add installed tools to PATH
        run: echo "$RUNNER_TEMP/package-checks/bin" >>"$GITHUB_PATH"
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Check wheel contents
        run: find dist -type f -name '*.whl' ! -name '*-pp*-win_amd64.whl' -exec check-wheel-contents --no-config {} +
      - name: Check PyPy Windows bundled runtime
        run: check-wheel-contents --no-config --toplevel turbohtml,turbohtml.libs --ignore W010 dist/*-pp*-win_amd64.whl
  verify-changelog:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a changelog section for the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected release tag $TAG"
            exit 1
          fi
          if ! grep -qE "^ v${TAG//./\\.} \\(" docs/changelog.rst; then
            echo "::error::docs/changelog.rst has no section for $TAG"
            exit 1
          fi
  release-gate:
    name: Release checks pass
    if: always()
    needs: [source-check, build-constraints, sdist, source-install, wheels, wheels-gate, wheel-metadata]
    runs-on: ubuntu-26.04
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS_JSON"
  github-draft:
    needs:
      - release-gate
      - verify-changelog
      - github-notes
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/github-release-notes
      - uses: tox-dev/github-workflows/publish-github-release@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: v${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/github-release-notes/release-notes.md
          mode: stage
  publish:
    name: 🚀 Publish ${{ matrix.artifact }}
    needs:
      - release-gate
      - verify-changelog
      - github-draft
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # one job per build artifact: signing every wheel in a single job exceeds the
    # Sigstore identity lifetime (sigstore.oidc.ExpiredIdentity), so split the upload
    # so each fresh OIDC token only has to attest its platform's wheels
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - dist-sdist
          - dist-linux-manylinux
          - dist-linux-musllinux
          - dist-linux-arm-manylinux
          - dist-linux-arm-musllinux
          - dist-macos-15
          - dist-windows-2025
    environment:
      name: release
      url: https://pypi.org/project/turbohtml
    permissions:
      id-token: write # trusted publishing, no API token stored
    steps:
      - name: ⬇️ Download ${{ matrix.artifact }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: 🚀 Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
  pypi-verify:
    needs: [publish, github-draft]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: tox-dev/github-workflows/reconcile-pypi-artifacts@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          project: turbohtml
          version: ${{ github.ref_name }}
          dist: dist
  previous-tag:
    needs: verify-changelog
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.previous.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: Add installed tools to PATH
        run: echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - name: Select previous tag
        id: previous
        uses: tox-dev/github-workflows/select-previous-tag@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          tag: ${{ github.ref_name }}
  contributor-metadata:
    needs: previous-tag
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Fetch contributor metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.previous-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "$PREVIOUS" ]]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f previous_tag_name="$PREVIOUS" \
              --jq .body >"$RUNNER_TEMP/generated-notes.md"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              --jq .body >"$RUNNER_TEMP/generated-notes.md"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contributor-metadata
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error
          retention-days: 1
  github-notes:
    needs: contributor-metadata
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: Add installed tools to PATH
        run: echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contributor-metadata
          path: ${{ runner.temp }}/contributor-metadata
      - uses: tox-dev/github-workflows/render-release-notes@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          tag: ${{ github.ref_name }}
          changelog: docs/changelog.rst
          artifact-url: https://pypi.org/project/turbohtml/${{ github.ref_name }}/
          generated-notes: ${{ runner.temp }}/contributor-metadata/generated-notes.md
          output: ${{ runner.temp }}/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1
  github-release:
    needs: [pypi-verify, github-draft, github-notes]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/github-release-notes
      - uses: tox-dev/github-workflows/publish-github-release@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: v${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/github-release-notes/release-notes.md
          mode: publish
