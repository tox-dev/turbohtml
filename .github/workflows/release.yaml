name: 🚀 Release
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]
    tags: ["*"]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
jobs:
  sdist:
    name: 📦 sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Build sdist
        run: uv build --sdist --out-dir dist
      - name: 📤 Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          retention-days: 7
  source-install:
    name: Source install - Windows ARM64
    needs: sdist
    runs-on: windows-11-arm
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        env:
          UV_VENV_SEED: "true"
        with:
          enable-cache: false
          activate-environment: true
          python-version: "3.15"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-sdist
          path: dist
      - name: Install source distribution
        run: python -m pip install --verbose (Get-ChildItem dist/*.tar.gz).FullName
      - name: Check installed extension
        run: python -c "from turbohtml import parse; assert parse('<p>ARM64</p>').select_one('p').text == 'ARM64'"
  wheels:
    name: 🎡 wheels - ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: "ubuntu-24.04", label: Linux manylinux, build: "*-manylinux*", artifact: linux-manylinux}
          - {os: "ubuntu-24.04", label: Linux musllinux, build: "*-musllinux*", artifact: linux-musllinux}
          - {os: "ubuntu-24.04-arm", label: Linux ARM manylinux, build: "*-manylinux*", artifact: linux-arm-manylinux}
          - {os: "ubuntu-24.04-arm", label: Linux ARM musllinux, build: "*-musllinux*", artifact: linux-arm-musllinux}
          - {os: "macos-15", label: macOS, build: "*", artifact: macos-15}
          - {os: "windows-2025", label: Windows, build: "*", artifact: windows-2025}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ⬇️ Install PGO corpora
        if: runner.os == 'Linux'
        run: |
          git submodule update --init --depth 1 \
            tests/html5lib-tests tools/html5lib-python \
            tools/bench-data/war-and-peace tools/bench-data/readability \
            tools/bench-data/normalize.css tools/bench-data/pico \
            tools/bench-data/underscore tools/bench-data/backbone
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: 🎡 Build wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          CIBW_BUILD: ${{ matrix.build }}
      - name: 📤 Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          retention-days: 7
  wheels-gate:
    name: 🎡 wheels - ${{ matrix.label }}
    needs: wheels
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        label: [Linux, Linux ARM]
    steps:
      - run: test '${{ needs.wheels.result }}' = success
  publish:
    name: 🚀 Publish ${{ matrix.artifact }}
    needs: [sdist, source-install, wheels, wheels-gate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # one job per build artifact: signing every wheel in a single job exceeds the
    # Sigstore identity lifetime (sigstore.oidc.ExpiredIdentity), so split the upload
    # so each fresh OIDC token only has to attest its platform's wheels
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - dist-sdist
          - dist-linux-manylinux
          - dist-linux-musllinux
          - dist-linux-arm-manylinux
          - dist-linux-arm-musllinux
          - dist-macos-15
          - dist-windows-2025
    environment:
      name: release
      url: https://pypi.org/project/turbohtml
    permissions:
      id-token: write # trusted publishing, no API token stored
    steps:
      - name: ⬇️ Download ${{ matrix.artifact }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: 🚀 Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          attestations: true
