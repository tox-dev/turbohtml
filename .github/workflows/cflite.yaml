name: 🧪 ClusterFuzzLite
on:
  workflow_dispatch:
  schedule:
    - cron: "43 11 * * *" # daily batch, then prune and coverage
concurrency:
  group: cflite-state
  cancel-in-progress: false
permissions:
  contents: read
# Corpus, crashes and logs go to the private repository named by vars.CFLITE_STORAGE_REPO, written with
# secrets.CFLITE_STORAGE_TOKEN: crash inputs and fuzz logs stay out of this repository's public branches and logs.
jobs:
  batch:
    name: 🧪 Run batch fuzzing (${{ matrix.sanitizer }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # the build takes up to 75 minutes, then fuzzing 60
    timeout-minutes: 165
    environment: cflite-storage
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sanitizer: ["address", "undefined"]
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: false
      - name: 📥 Check out the storage repository
        run: bash tools/fuzz/cflite_storage.sh clone
        env:
          STORAGE_REPO: ${{ vars.CFLITE_STORAGE_REPO }}
          STORAGE_TOKEN: ${{ secrets.CFLITE_STORAGE_TOKEN }}
      - name: 🧪 Fuzz for 3600 s
        run: >-
          uv run --no-project --python 3.15 python tools/fuzz/cflite.py --mode batch --sanitizer "${SANITIZER}" --seconds 3600 --source "${GITHUB_WORKSPACE}" --workspace "${RUNNER_TEMP}/cflite"
        env:
          SANITIZER: ${{ matrix.sanitizer }}
      - name: 📤 Store corpus, crashes and logs
        if: success() || failure()
        run: bash tools/fuzz/cflite_storage.sh push "batch ${SANITIZER}"
        env:
          STORAGE_REPO: ${{ vars.CFLITE_STORAGE_REPO }}
          STORAGE_TOKEN: ${{ secrets.CFLITE_STORAGE_TOKEN }}
          SANITIZER: ${{ matrix.sanitizer }}
      - name: ⚙️ Check for SARIF
        id: sarif
        if: success() || failure()
        run: |
          if compgen -G "${RUNNER_TEMP}/cflite/cifuzz-sarif/*.sarif" > /dev/null; then
            echo 'present=true' >> "${GITHUB_OUTPUT}"
          fi
      - name: 🛡️ Upload SARIF
        if: (success() || failure()) && steps.sarif.outputs.present == 'true'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/cflite/cifuzz-sarif
          category: cflite-${{ matrix.sanitizer }}
  prune:
    name: 🧪 Prune the corpus
    needs: batch
    if: (success() || failure()) && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # the build takes up to 75 minutes, then pruning 75
    timeout-minutes: 180
    environment: cflite-storage
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: false
      - name: 📥 Check out the storage repository
        run: bash tools/fuzz/cflite_storage.sh clone
        env:
          STORAGE_REPO: ${{ vars.CFLITE_STORAGE_REPO }}
          STORAGE_TOKEN: ${{ secrets.CFLITE_STORAGE_TOKEN }}
      - name: 🧪 Prune the corpus
        # one merge per target, a core each; a target still merging at the deadline is stopped and fails the step
        run: >-
          uv run --no-project --python 3.15 python tools/fuzz/cflite.py --mode prune --sanitizer address --seconds 4500 --source "${GITHUB_WORKSPACE}" --workspace "${RUNNER_TEMP}/cflite"
      - name: 📤 Store the pruned corpus and logs
        if: success() || failure()
        run: bash tools/fuzz/cflite_storage.sh push "prune"
        env:
          STORAGE_REPO: ${{ vars.CFLITE_STORAGE_REPO }}
          STORAGE_TOKEN: ${{ secrets.CFLITE_STORAGE_TOKEN }}
  coverage:
    name: 📊 Check coverage and reachability floors
    needs: prune
    if: (success() || failure()) && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # the build takes up to 30 minutes, then measuring 120
    timeout-minutes: 165
    environment: cflite-storage
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: false
      - name: 📥 Check out the storage repository
        run: bash tools/fuzz/cflite_storage.sh clone
        env:
          STORAGE_REPO: ${{ vars.CFLITE_STORAGE_REPO }}
          STORAGE_TOKEN: ${{ secrets.CFLITE_STORAGE_TOKEN }}
      - name: 📊 Measure coverage over the stored corpus
        # every target runs at once: with one job per core, the targets queued behind the first wave reached the deadline
        # before they started and were reported as timed out without running
        run: >-
          uv run --no-project --python 3.15 python tools/fuzz/cflite.py --mode coverage --sanitizer coverage --seconds 7200 --jobs 64 --source "${GITHUB_WORKSPACE}" --workspace "${RUNNER_TEMP}/cflite"
      - name: 📊 Check reachability floors
        # each Atheris target's callback and Python-implemented exports must execute at least one line
        run: uvx --with tox-uv tox run -e fuzz-reachability -- --coverage-dir "${RUNNER_TEMP}/cflite/coverage-data"
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - name: 📤 Store the coverage logs
        if: success() || failure()
        run: bash tools/fuzz/cflite_storage.sh push "coverage"
        env:
          STORAGE_REPO: ${{ vars.CFLITE_STORAGE_REPO }}
          STORAGE_TOKEN: ${{ secrets.CFLITE_STORAGE_TOKEN }}
