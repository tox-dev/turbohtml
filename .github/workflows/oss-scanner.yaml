name: 🛡️ OSS Scanner image
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .oss-scanner/**
      - .github/workflows/oss-scanner.yaml
      - .clusterfuzzlite/**
      - meson.build
      - pylock.toml
concurrency:
  group: oss-scanner-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  build:
    name: 🛡️ Build the OSS Scanner image
    # anthropics/oss-scanner builds this image on the same runner before enrolling or scanning the project.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # meson project() derives the version from git history
          persist-credentials: false
      - name: 🛡️ Build the image
        run: docker build --file .oss-scanner/Dockerfile .
