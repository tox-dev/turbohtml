name: 👷 benchmark
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
concurrency:
  # Key push runs by commit, pull-request runs by ref. Every main commit is a base measurement some
  # open PR compares against, so it must run to completion; keying pushes by ref meant the next main
  # commit canceled the previous one's benchmark mid-run, leaving CodSpeed to diff against a partial
  # or stale base and report drift on untouched benchmarks. Pull-request runs still supersede their
  # own older commits.
  group: codspeed-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  codspeed:
    name: 🚀 CodSpeed
    # OIDC only authenticates the repository registered with CodSpeed, so a fork's push runs fail with 401 Unauthorized
    if: github.repository == 'tox-dev/turbohtml'
    # The tox-dev org has no plan for CodSpeed's macro runners; the pins in the steps below hold the instruction
    # stream steady across GitHub's mixed Intel and AMD fleet instead.
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON_INSTALL_DIR: /bench/python
    permissions:
      contents: read
      id-token: write # OIDC lets the CodSpeed GitHub App authenticate this public repo without a token secret
    steps:
      # GitHub rolls a new runner image out over days, so a base run and a head run can land on images that ship
      # different glibc builds. Upgrading to the archive's current build gives every run the same one.
      - name: 📦 Upgrade glibc to the archive build
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libc6-dbg
      # Python lists every directory it imports from, and pytest finds its plugins by listing site-packages. ext4
      # returns entries in hash order under a per-filesystem seed that each runner image sets differently, so the
      # listing order, the allocation order behind it, and the heap addresses the benchmarks touch all followed the
      # image. A filesystem made with a fixed seed lists every directory in the same order on every runner.
      - name: 💾 Mount a fixed-seed filesystem over the workspace
        run: |
          sudo truncate -s 16G /bench.img
          sudo mkfs.ext4 -q -U 6c1b5a8e-3f0a-4c2e-9d7b-1a2b3c4d5e6f -E hash_seed=0b5e2c7a-9d41-4f3e-8a6c-5d7e8f9a0b1c \
            /bench.img
          sudo mkdir /bench
          sudo mount -o loop,noatime /bench.img /bench
          sudo chown "$(id -u):$(id -g)" /bench
          mkdir /bench/work /bench/python
          sudo mount --bind /bench/work "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # meson derives the package version from git, so a base run on a release tag reports 1.9.0 while the pull
      # request CodSpeed diffs against it reports 1.9.0.dev2+g9bbf223. That string reaches the benchmark process
      # through the install metadata it reads at startup, and the extra bytes shift the heap addresses that follow,
      # moving the simulated cache misses of benchmarks the change does not touch. One tag on HEAD gives both one
      # version.
      - name: 📌 Pin the package version
        run: git tag 0.0.0
      - name: ⬇️ Install benchmark data
        run: git submodule update --init --depth 1 tools/html5lib-python tools/bench-data/war-and-peace
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          # CodSpeed diffs this run against the base commit's run, measured whenever that commit landed, so an
          # interpreter patch released in between changes the instruction counts of untouched benchmarks. Pin the
          # exact build and bump it by hand.
          python-version: "3.14.7"
      # Build outside instrumentation so setup is not measured. Use LTO because fresh PGO profiles produce different
      # binaries; release wheels retain PGO+LTO.
      - name: 🏗️ Build the deterministic LTO extension and install benchmark deps
        run: |
          uvx --with tox-uv tox run -e codspeed --notest
          uv pip install --python .tox/codspeed/bin/python --reinstall --no-deps --no-build-isolation --editable . \
            --config-settings=build-dir=.tox/codspeed/cbuild \
            --config-settings=setup-args=-Dbuildtype=release \
            --config-settings=setup-args=-Db_lto=true
        env:
          UV_PYTHON_PREFERENCE: only-managed
      # The minifier and page benchmarks read corpora that bench.corpus downloads on first use. Fetched inside the
      # benchmark process, the TLS handshakes and response headers allocate differently on every run, so no two runs
      # shared a heap layout.
      - name: ⬇️ Download the network corpora
        run: .tox/codspeed/bin/python -c 'import sys; sys.path.insert(0, "tools"); from bench.corpus import prefetch; prefetch()'
      # Callgrind counts every instruction glibc runs, and glibc picks its memcpy, memset, str*, and lazy-binding code
      # per CPU. GitHub hands each run an Intel Xeon or an AMD EPYC whose feature and preference bits select different
      # variants, so identical code counts differently between a base run and a head run. Turning every selector off
      # lands each runner on the same SSE2 baseline; the copy thresholds glibc derives from the runner's cache sizes
      # and the malloc arena count it derives from the core count are pinned for the same reason. The gate measures
      # instruction counts, so the slower baseline path costs nothing.
      - name: 📌 Pin glibc's per-CPU code paths
        run: |
          hwcaps=$(printf -- '-%s,' \
            SSSE3 SSE4_1 SSE4_2 AVX AVX2 AVX512F AVX512VL AVX512BW AVX512DQ AVX512CD FMA FMA4 \
            BMI1 BMI2 LZCNT POPCNT MOVBE ERMS RTM XSAVEC \
            Fast_Unaligned_Load Fast_Unaligned_Copy Fast_Copy_Backward Fast_Rep_String Slow_BSF Slow_SSE4_2 \
            Prefer_ERMS Prefer_FSRM Prefer_No_VZEROUPPER Prefer_No_AVX512)
          tunables=$(printf '%s:' \
            "glibc.cpu.hwcaps=${hwcaps%,}" \
            glibc.cpu.x86_data_cache_size=32768 \
            glibc.cpu.x86_shared_cache_size=1048576 \
            glibc.cpu.x86_non_temporal_threshold=786432 \
            glibc.cpu.x86_rep_movsb_threshold=2048 \
            glibc.cpu.x86_rep_stosb_threshold=2048 \
            glibc.malloc.arena_max=1)
          echo "GLIBC_TUNABLES=${tunables%:}" >> "$GITHUB_ENV"
      - name: 🚀 Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        env:
          # str hashes seed the dict and set probes the benchmarks walk; a fresh seed per run is a small run-to-run
          # term the CPU pins above do not cover.
          PYTHONHASHSEED: "0"
        with:
          # The instrument cache is keyed by kernel, not by image, so a restore brings back debug symbols for
          # whichever glibc the saving run had.
          cache-instruments: false
          exclude-allocations: true
          mode: simulation
          # The runner hands the job's whole environment to the benchmark process, and a pull request run carries
          # different GITHUB_* values than the push run CodSpeed diffs it against. Python copies that environment into
          # os.environ at startup, so the extra bytes shift the heap the way the version string does. Keep the
          # variables the process reads and drop the rest.
          run: |
            keep=()
            for name in PATH GLIBC_TUNABLES PYTHONHASHSEED PYTHONMALLOC PYTHON_PERF_JIT_SUPPORT \
              CODSPEED_ENV CODSPEED_PROFILE_FOLDER CODSPEED_RUNNER_MODE; do
              [[ -v $name ]] && keep+=("$name=${!name}")
            done
            exec env -i "${keep[@]}" .tox/codspeed/bin/python -m pytest tests/benchmarks --codspeed
