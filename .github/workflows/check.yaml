name: 🛠️ check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "0 8 * * *"
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: 🧪 ${{ matrix.py }} - ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The C-coverage gate runs where gcov/llvm-cov exist; on Windows the same
        # suite runs without it (MSVC has no gcov), gated natively in tox.toml.
        os: ["ubuntu-24.04", "macos-15", "windows-2025"]
        py: ["3.15", "3.14", "3.13", "3.12", "3.11", "3.15t", "3.14t"]
        include:
          - {os: "ubuntu-24.04", label: Linux, cov: "gcov"}
          - {os: "macos-15", label: macOS, cov: "xcrun llvm-cov gcov"}
          - {os: "windows-2025", label: Windows, cov: ""}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ⬇️ Install test data
        id: test-data
        background: true
        shell: bash
        run: bash tools/ci_test_data.sh
      - name: 🟢 Install Node
        # zizmor: ignore[cache-poisoning] no cache: input is set, so setup-node writes no restorable cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - wait: test-data
      - name: ✅ Run ${{ matrix.py }}
        run: uvx --with tox-uv tox run --skip-missing-interpreters false -e ${{ matrix.py }}
        env:
          UV_PYTHON_PREFERENCE: only-managed
          COV_GCOV: ${{ matrix.cov }}
      - name: Report failed selector branches
        if: ${{ failure() && runner.os == 'macOS' && contains(fromJSON('["3.11","3.12","3.13","3.14"]'), matrix.py) }}
        run: |
          xcrun clang --version
          xcode-select -p
          cat ".tox/$TOX_ENV/cbuild/meson-info/intro-compilers.json"
          ".tox/$TOX_ENV/bin/gcovr" ".tox/$TOX_ENV/cbuild" --root "$PWD" \
            --filter 'src/turbohtml/_c/css/select/selector.c' \
            --gcov-executable 'xcrun llvm-cov gcov' --json ".tox/$TOX_ENV/tmp/selector-coverage.json"
          jq '[.files[].lines[] | select(.line_number == 379)]' ".tox/$TOX_ENV/tmp/selector-coverage.json"
        env:
          TOX_ENV: ${{ matrix.py }}
  pypy:
    # PyPy stands outside the test matrix because it runs no coverage gate: gcovr reaches cpyext only through lxml,
    # which publishes no PyPy wheels, and a cpyext build has no gcov to feed it. Both gates run on the matrix above.
    name: 🧪 ${{ matrix.py }} - Linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        py: ["pypy3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ⬇️ Install test data
        id: test-data
        background: true
        shell: bash
        run: bash tools/ci_test_data.sh
      - name: 🟢 Install Node
        # zizmor: ignore[cache-poisoning] no cache: input is set, so setup-node writes no restorable cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - wait: test-data
      - name: ✅ Run ${{ matrix.py }}
        run: uvx --with tox-uv tox run --skip-missing-interpreters false -e ${{ matrix.py }}
        env:
          UV_PYTHON_PREFERENCE: only-managed
  scalar:
    # TH_FORCE_SCALAR compiles the portable SWAR scan loops in place of SSE2 (x64) and NEON (arm64), so the suite's
    # expectations, which the SIMD build already meets, diff the two arms on each architecture.
    name: 🧪 SWAR scan loops (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: "ubuntu-24.04", arch: "x64"}
          - {os: "ubuntu-24.04-arm", arch: "arm64"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ⬇️ Install test data
        id: test-data
        background: true
        shell: bash
        run: bash tools/ci_test_data.sh
      - name: 🟢 Install Node
        # zizmor: ignore[cache-poisoning] no cache: input is set, so setup-node writes no restorable cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - wait: test-data
      - name: ✅ Run scalar
        run: uvx --with tox-uv tox run --skip-missing-interpreters false -e scalar
        env:
          UV_PYTHON_PREFERENCE: only-managed
  preprocess-identity:
    name: 🧬 production preprocessing identity
    runs-on: ubuntu-24.04
    # the fuzz-only build adds #ifdef branches to production sources and headers; a production token change would shift
    # LTO inlining and the CodSpeed gate, so this compares the production preprocessing with those branches stripped
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # meson project() derives the version from git history
          persist-credentials: false
      - name: 📦 Install unifdef
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends unifdef
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: ✅ Run preprocess-identity
        run: uvx --with tox-uv tox run -e preprocess-identity
        env:
          UV_PYTHON_PREFERENCE: only-managed
  check:
    name: 🔎 ${{ matrix.tox_env }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tox_env: ["type", "docs", "pkg_meta", "atheris"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: ✅ Run ${{ matrix.tox_env }}
        run: uvx --with tox-uv tox run -e ${{ matrix.tox_env }}
        env:
          UV_PYTHON_PREFERENCE: only-managed
  conformance:
    name: 🔬 conformance
    runs-on: ubuntu-24.04
    # The tests/conformance/ suites validate each feature against a competitor's or standards body's OWN test suite,
    # vendored as pinned submodules under tests/conformance/<oracle> (libxml2, unicodetools, xml-conformance-suite,
    # qt3tests, parse5, DOMPurify, ...) and/or a Node oracle in tools/bench/node (jsdom, DOMPurify, parse5). They must
    # RUN with those oracles present: a suite whose submodule is absent errors instead of skipping, which is the whole
    # point of this job. The normal matrix deselects tests/conformance (tox --ignore) so it never runs an oracle suite
    # without the oracle. This is a pass/fail correctness gate, not a coverage gate -- the 100% line/branch gate stays
    # on the matrix (env_run_base), deliberately not bolted on here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # meson project() derives the version from git history
          submodules: recursive # every conformance oracle plus the html5lib-tests data; shallow submodules init here too
          persist-credentials: false
      - name: 🟢 Install Node
        # zizmor: ignore[cache-poisoning] no cache: input is set, so setup-node writes no restorable cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - parallel:
          - name: 📦 Install the Node oracle deps (jsdom, DOMPurify, parse5)
            run: npm ci
            working-directory: tools/bench/node
          - name: 🔄 Install uv
            uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
            with:
              version: latest-known
              python-version: "3.15"
              enable-cache: false
      - name: ✅ Run the conformance suites
        run: uvx --with tox-uv tox run -e conformance
        env:
          UV_PYTHON_PREFERENCE: only-managed
  warnings:
    name: 🚨 -Werror (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # compile the C extension with -Werror so any compiler warning fails the build. The
    # warning set differs per compiler (gcc flags fall-through clang does not) and the SIMD
    # helpers are #if-gated per architecture (SSE2 on x86, NEON on arm64), so the gate is a
    # compiler x SIMD-path grid: gcc and clang each over x86 and arm64. MSVC is a separate
    # job below because it is detected without CC. macOS gcc is omitted as redundant with
    # Linux gcc arm64 — same compiler, same NEON path, and the OS does not change the warnings.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: "ubuntu-24.04", cc: "gcc", label: "gcc · Linux x64"}
          - {os: "ubuntu-24.04", cc: "clang", label: "clang · Linux x64"}
          - {os: "ubuntu-24.04-arm", cc: "gcc", label: "gcc · Linux arm64"}
          - {os: "macos-15", cc: "clang", label: "clang · macOS arm64"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # meson project() derives the version from git history
          persist-credentials: false
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: ✅ Build with -Werror
        run: uvx --with tox-uv tox run -e warnings
        env:
          UV_PYTHON_PREFERENCE: only-managed
          CC: ${{ matrix.cc }}
  warnings-msvc:
    name: 🚨 -Werror (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # MSVC is detected by meson without a CC override and maps -Werror to /WX; split from the matrix
    # above so an empty CC env never shadows the auto-detection. x64 builds the SSE2 branch; on
    # windows-11-arm meson does not self-detect MSVC, so that cell installs an arm64 dev Python and
    # activates the native arm64 toolchain with setup-msvc-dev (its INCLUDE/LIB ride through tox via
    # pass_env), giving MSVC coverage of the _M_ARM64 NEON branch too.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: "windows-2025", label: "MSVC · Windows x64", arm: false}
          - {os: "windows-11-arm", label: "MSVC · Windows arm64", arm: true}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # meson project() derives the version from git history
          persist-credentials: false
      - name: 🐍 Install arm64 dev Python (carries the .lib meson needs)
        if: matrix.arm
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        env:
          UV_VENV_SEED: "true"
        with:
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: "3.15"
      - name: 🧰 Activate native arm64 MSVC (so meson picks cl over MinGW gcc)
        if: matrix.arm
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: arm64
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: ✅ Build with -Werror
        run: uvx --with tox-uv tox run -e warnings
        env:
          UV_PYTHON_PREFERENCE: only-managed
  clang-tidy:
    name: 🧹 clang-tidy (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    # the clang-tidy pre-commit hook needs a local Meson build of the C extension, so it
    # is skipped on pre-commit.ci; run it here where the toolchain and headers are available.
    # both architectures run because the SIMD escape/scan helpers are #if-gated — x86 compiles
    # the SSE2 variant, arm64 the NEON one — and clang-tidy only analyzes the branch it builds.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: "ubuntu-24.04", arch: "x64"}
          - {os: "ubuntu-24.04-arm", arch: "arm64"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # meson project() derives the version from git history
          persist-credentials: false
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: ✅ Run clang-tidy
        run: uvx pre-commit run clang-tidy --all-files --show-diff-on-failure --color always
        env:
          UV_PYTHON_PREFERENCE: only-managed
  tsan:
    name: 🧵 ThreadSanitizer (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # Two shards trade one extra container job (~5 min of setup, build and collection per run) for wall time: TSan is
    # the longest job, and its two slowest tests plus the lifecycle races take about half its test time. tox.toml's
    # tsan env selects each shard from TSAN_SHARD; together they run exactly the tests one unsharded run does.
    strategy:
      fail-fast: false
      matrix:
        shard: ["heavy", "rest"]
    container:
      image: ghcr.io/nascheme/cpython-tsan:3.15t-dev@sha256:d83ce086fa8586ef200e09a109a85628e3091128efb4bf6db2fbc07b5ba06ea7
      options: --shm-size=2g # TSan shadow memory needs the headroom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 🔍 Check the interpreter is free-threaded and TSan-instrumented
        run: >-
          python3 -c "import sys, sysconfig; assert sys.version_info[:2] == (3, 15); assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1; assert '--with-thread-sanitizer' in sysconfig.get_config_var('CONFIG_ARGS')"
      - name: ✅ Run tsan
        run: >-
          TSAN_PYTHON=$(python3 -c 'import sys; print(sys.executable)') uvx --python-preference only-managed --python 3.15 --with tox-uv tox run -e tsan --skip-missing-interpreters false
        env:
          UV_PYTHON_PREFERENCE: only-system # use the container's TSan interpreter, not a uv-managed one
          TSAN_SHARD: ${{ matrix.shard }}
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@fcba1cc52c8e8bbb8c3305ee5e4bc454b9ab0c50
        with:
          groups: release-news
          venv: ${{ runner.temp }}/release-tools
      - name: Add installed tools to PATH
        run: echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - uses: tox-dev/github-workflows/validate-news@fcba1cc52c8e8bbb8c3305ee5e4bc454b9ab0c50
  hook-update-cooldown:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/check-hook-update-cooldown@fcba1cc52c8e8bbb8c3305ee5e4bc454b9ab0c50
        with:
          repository: ${{ github.repository }}
          pull-request: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
  gate:
    name: Required checks pass
    if: always()
    needs:
      - test
      - pypy
      - scalar
      - preprocess-identity
      - check
      - conformance
      - warnings
      - warnings-msvc
      - clang-tidy
      - tsan
      - changelog
      - hook-update-cooldown
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jq -e --arg event "$EVENT_NAME" '
            all(
              to_entries[];
              .value.result == "success" or
              ((.key == "changelog" or .key == "hook-update-cooldown") and
               .value.result == "skipped" and $event != "pull_request")
            )
          ' <<<"$NEEDS_JSON"
