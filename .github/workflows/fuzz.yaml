name: 🔒 fuzz
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily deep run, 06:00 UTC
    - cron: "0 4 * * 1" # weekly extended run, Monday 04:00 UTC
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke:
    name: 💨 ASan/UBSan smoke (benign corpus)
    runs-on: ubuntu-24.04
    # Build every harness under -fsanitize=address,undefined and replay the benign seed corpus before the deep hunt.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # meson project() derives the version from git history
          persist-credentials: false
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: ✅ Run fuzz-smoke
        run: uvx --with tox-uv tox run -e fuzz-smoke
        env:
          UV_PYTHON_PREFERENCE: only-managed
  msan:
    name: 🧠 MemorySanitizer standalone harnesses
    runs-on: ubuntu-24.04
    # the IDNA, phone, JS and CSS cores link no interpreter, so MemorySanitizer sees every byte they read and catches
    # the uninitialized reads AddressSanitizer misses
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: ✅ Run msan
        run: uvx --with tox-uv tox run -e msan
        env:
          UV_PYTHON_PREFERENCE: only-managed
  oracle:
    name: 🧪 sanitizer wrong-output oracles
    runs-on: ubuntu-24.04
    # a sanitize bug usually returns unsafe markup without crashing, so this lane compares the sanitizer with an
    # independent re-parse (html5lib-python, parse5 to confirm), the random Policy it ran under, and the WHATWG URL
    # scheme. Scheduled and manual runs add MutaGen-style generation for a wall-clock budget.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🟢 Install Node
        # zizmor: ignore[cache-poisoning] no cache: input is set, so setup-node writes no restorable cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: 📦 Install parse5 for the confirming re-parse
        run: npm ci
        working-directory: tools/bench/node
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: ✅ Run fuzz-oracle
        # the seed regenerates every finding from the public code, so it stays out of the tox command line it echoes
        run: |
          FUZZ_RNG_SEED="$(uv run --no-project --python 3.15 python -c 'import secrets; print(secrets.randbits(32))')"
          export FUZZ_RNG_SEED
          uvx --with tox-uv tox run -e fuzz-oracle -- --minutes "${MINUTES}"
        env:
          UV_PYTHON_PREFERENCE: only-managed
          MINUTES: ${{ github.event.schedule == '0 4 * * 1' && '20' || '8' }}
      - name: 🔐 Encrypt findings
        if: failure() && vars.FUZZ_AGE_RECIPIENT != ''
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  ${RUNNER_TEMP}/age.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/age.tar.gz" -C "${RUNNER_TEMP}" age/age
          mkdir -p "${RUNNER_TEMP}/fuzz-oracle"
          shopt -s nullglob
          for finding in .fuzz-crashes/crash-* .fuzz-crashes/current_input.html; do
            "${RUNNER_TEMP}/age/age" --recipient "${RECIPIENT}" \
              --output "${RUNNER_TEMP}/fuzz-oracle/$(basename "${finding}").age" "${finding}"
          done
        env:
          AGE_VERSION: v1.3.2
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
          RECIPIENT: ${{ vars.FUZZ_AGE_RECIPIENT }}
      - name: 📤 Upload encrypted findings
        if: failure() && vars.FUZZ_AGE_RECIPIENT != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-oracle
          path: ${{ runner.temp }}/fuzz-oracle/*.age
          if-no-files-found: ignore
          retention-days: 14
  round-trip:
    name: 🔁 round-trip and consistency oracles
    runs-on: ubuntu-24.04
    # a printer or minifier bug returns wrong text without crashing, so this lane checks print-and-reparse fixpoints,
    # minifier semantics, agreeing entry points and source spans. Findings need triage, and crashers leave the runner
    # only encrypted.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🟢 Install Node
        # zizmor: ignore[cache-poisoning] no cache: input is set, so setup-node writes no restorable cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: 📦 Install acorn and eslint-scope for the JS identifier oracle
        run: npm ci
        working-directory: tools/bench/node
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: ✅ Run fuzz-round-trip
        # the seed regenerates every finding from the public code, so it stays out of the tox command line it echoes
        run: |
          FUZZ_RNG_SEED="$(uv run --no-project --python 3.15 python -c 'import secrets; print(secrets.randbits(32))')"
          export FUZZ_RNG_SEED
          uvx --with tox-uv tox run -e fuzz-round-trip -- --minutes "${MINUTES}"
        env:
          UV_PYTHON_PREFERENCE: only-managed
          MINUTES: ${{ github.event.schedule == '0 4 * * 1' && '20' || '8' }}
      - name: 🔐 Encrypt findings
        if: failure() && vars.FUZZ_AGE_RECIPIENT != ''
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  ${RUNNER_TEMP}/age.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/age.tar.gz" -C "${RUNNER_TEMP}" age/age
          mkdir -p "${RUNNER_TEMP}/fuzz-round-trip"
          shopt -s nullglob
          for finding in .fuzz-crashes/crash-*; do
            "${RUNNER_TEMP}/age/age" --recipient "${RECIPIENT}" \
              --output "${RUNNER_TEMP}/fuzz-round-trip/$(basename "${finding}").age" "${finding}"
          done
        env:
          AGE_VERSION: v1.3.2
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
          RECIPIENT: ${{ vars.FUZZ_AGE_RECIPIENT }}
      - name: 📤 Upload encrypted findings
        if: failure() && vars.FUZZ_AGE_RECIPIENT != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-round-trip
          path: ${{ runner.temp }}/fuzz-round-trip/*.age
          if-no-files-found: ignore
          retention-days: 14
  amplify:
    name: 📈 super-linear regressions
    runs-on: ubuntu-24.04
    # re-scores every past super-linear input as a growth ratio (time per doubling and an output bound), not against a
    # deadline, so a slower runner does not fail it; the shape search runs in the deep job below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # meson project() derives the version from git history
          persist-credentials: false
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: ✅ Run fuzz-amplify
        run: uvx --with tox-uv tox run -e fuzz-amplify
        env:
          UV_PYTHON_PREFERENCE: only-managed
  alloc:
    name: 🧯 allocation-failure sweep
    runs-on: ubuntu-24.04
    # fails each PyMem allocation of every seed in turn (libxml2's malloc-fail sweep) and requires MemoryError exactly
    # when the failure fires. Like the deep hunt it is not a PR gate: a finding needs triage, and it leaves the runner
    # only encrypted.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: ✅ Run fuzz-alloc
        run: uvx --with tox-uv tox run -e fuzz-alloc
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - name: 🔐 Encrypt findings
        if: failure() && vars.FUZZ_AGE_RECIPIENT != ''
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  ${RUNNER_TEMP}/age.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/age.tar.gz" -C "${RUNNER_TEMP}" age/age
          mkdir -p "${RUNNER_TEMP}/fuzz-alloc"
          shopt -s nullglob
          for finding in .fuzz-crashes/crash-*; do
            "${RUNNER_TEMP}/age/age" --recipient "${RECIPIENT}" \
              --output "${RUNNER_TEMP}/fuzz-alloc/$(basename "${finding}").age" "${finding}"
          done
        env:
          AGE_VERSION: v1.3.2
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
          RECIPIENT: ${{ vars.FUZZ_AGE_RECIPIENT }}
      - name: 📤 Upload encrypted findings
        if: failure() && vars.FUZZ_AGE_RECIPIENT != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-alloc
          path: ${{ runner.temp }}/fuzz-alloc/*.age
          if-no-files-found: ignore
          retention-days: 14
  deep:
    name: 🕳️ ASan/UBSan deep (mutation + structural)
    runs-on: ubuntu-24.04
    # Mutation and escalating-depth probes run for a wall-clock budget per target. A maintainer triages new finds.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: ✅ Run fuzz (deep)
        # the Monday 04:00 slot runs each target longer; the daily 06:00 slot and manual dispatch use the shorter budget
        # The seed is secret: with the public code it regenerates every crasher, so it stays out of the command line
        # tox echoes and reaches fuzz.py only through the environment and the encrypted .replay files.
        run: |
          FUZZ_RNG_SEED="$(uv run --no-project --python 3.15 python -c 'import secrets; print(secrets.randbits(32))')"
          export FUZZ_RNG_SEED
          uvx --with tox-uv tox run -e fuzz -- --minutes "${MINUTES}"
        env:
          UV_PYTHON_PREFERENCE: only-managed
          MINUTES: ${{ github.event.schedule == '0 4 * * 1' && '20' || '8' }}
      - name: 📈 Run fuzz-amplify (search)
        # runs even when the crash hunt above failed; its findings join the crashers that the steps below encrypt
        if: success() || failure()
        run: |
          FUZZ_RNG_SEED="$(uv run --no-project --python 3.15 python -c 'import secrets; print(secrets.randbits(32))')"
          export FUZZ_RNG_SEED
          uvx --with tox-uv tox run -e fuzz-amplify -- search --minutes "${MINUTES}"
        env:
          UV_PYTHON_PREFERENCE: only-managed
          MINUTES: ${{ github.event.schedule == '0 4 * * 1' && '20' || '8' }}
      # A crasher of an unfixed bug is an undisclosed vulnerability, and artifacts on a public repository are readable
      # by anyone, so crashers leave the runner only encrypted to the maintainers' age key; without the key nothing
      # leaves.
      - name: 🔐 Encrypt crashers
        if: failure() && vars.FUZZ_AGE_RECIPIENT != ''
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  ${RUNNER_TEMP}/age.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/age.tar.gz" -C "${RUNNER_TEMP}" age/age
          mkdir -p "${RUNNER_TEMP}/fuzz-crashes"
          shopt -s nullglob
          for crasher in .fuzz-crashes/crash-*; do
            "${RUNNER_TEMP}/age/age" --recipient "${RECIPIENT}" \
              --output "${RUNNER_TEMP}/fuzz-crashes/$(basename "${crasher}").age" "${crasher}"
          done
        env:
          AGE_VERSION: v1.3.2
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
          RECIPIENT: ${{ vars.FUZZ_AGE_RECIPIENT }}
      - name: 📤 Upload encrypted crashers
        if: failure() && vars.FUZZ_AGE_RECIPIENT != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: ${{ runner.temp }}/fuzz-crashes/*.age
          if-no-files-found: ignore
          retention-days: 14
