name: 🛡️ CodeQL
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 9 * * 2"
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  analyze:
    name: 🛡️ Analyze
    uses: tox-dev/github-workflows/.github/workflows/codeql.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["actions","python"]'
      paths-ignore: '["tests","tools/bench","tools/fuzz"]'
  analyze-c:
    name: 🛡️ Analyze c-cpp
    runs-on: ubuntu-26.04
    permissions:
      contents: read # check out the code to analyze
      security-events: write # upload the analysis results to code scanning
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 🛡️ Initialize CodeQL
        uses: github/codeql-action/init@v4.39.2
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
          config: |
            paths-ignore:
              - tests
              - tools/bench
              - tools/fuzz
      - name: 🏗️ Build C extension
        run: |
          uvx --from meson==1.12.1 --with ninja==1.13.2 meson setup build
          uvx --from meson==1.12.1 --with ninja==1.13.2 meson compile -C build
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - name: 🛡️ Analyze
        uses: github/codeql-action/analyze@v4.39.2
        with:
          category: "/language:c-cpp"
