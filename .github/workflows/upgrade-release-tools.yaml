name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
concurrency:
  group: upgrade-release-tools
  cancel-in-progress: false
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@74472c1a3602ca9b66db058ea31578865e1d208b
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      lock-groups: >-
        release-check release-news release-notes release-prepare release-validate
      additional-lock: pylock.pgo.toml
      additional-lock-groups: pgo
      additional-matrix-python: ">=3.11,<3.16"
      additional-matrix-platforms: linux_x86_64 linux_aarch64 macos_arm64 windows_amd64 windows_arm64
      additional-matrix-implementations: cpython pypy
