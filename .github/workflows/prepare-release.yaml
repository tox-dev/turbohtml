name: 🏷️ Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump strategy
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto
permissions: {}
jobs:
  prepare:
    name: 🏷️ Prepare Towncrier release
    uses: tox-dev/github-workflows/.github/workflows/prepare-towncrier-release.yaml@534a196a132a52365c464e1227d4c46f30968f29 # 6.4.0
    permissions:
      contents: read
      pull-requests: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      bump: ${{ inputs.bump }}
      annotated: true
      # temporary, delete after 2026-11-02
      exclude-newer-package: |
        nab=2026-10-26T01:50:50Z
        nab-index=2026-10-26T01:50:50Z
        nab-markersets=2026-10-26T01:50:50Z
        nab-project=2026-10-26T01:50:50Z
        nab-provider=2026-10-26T01:50:50Z
        nab-resolver=2026-10-26T01:50:50Z
