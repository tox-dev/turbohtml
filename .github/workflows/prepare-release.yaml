name: 🛠️ Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump strategy
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto
permissions: {}
jobs:
  prepare:
    uses: tox-dev/github-workflows/.github/workflows/prepare-towncrier-release.yaml@3553fb1bb4ed1385f8b68571de1b5515edf2d339
    permissions:
      contents: read
      pull-requests: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      bump: ${{ inputs.bump }}
      changelog: docs/changelog.rst
      fragments: docs/changelog
      format: rst
      annotated: true
